name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "config/**"
      - "fixture/**"
      - "cypress/**"
      - "cypress.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "59 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-extended-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_VERSION: 11.19.1

jobs:
  compatibility:
    name: ${{ matrix.lane }} · Node ${{ matrix.node }} · ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: browser-compatibility
            node: 24.20.0
            browser: firefox
          - lane: maintenance-lts-runtime
            node: 22.23.2
            browser: chrome
    env:
      CYPRESS_BASE_URL: http://127.0.0.1:3100
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm toolchain
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@${NPM_VERSION}" --ignore-scripts --no-audit --no-fund
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install the explicitly approved Cypress binary
        run: npm run cypress:install
      - name: Validate framework and workflow contracts
        run: npm run config:check
      - run: npm run cypress:verify
      - name: Run Cypress in ${{ matrix.browser }} against repository-owned fixture
        run: npm run test:${{ matrix.browser }}
      - name: Validate meaningful Cypress evidence and reject retry-recovered passes
        run: node config/retryPolicy.js reports/run-manifest.json
      - name: Publish compatibility observability summary
        if: always()
        run: |
          mkdir -p "reports/extended-node-${{ matrix.node }}-${{ matrix.browser }}"
          {
            echo "### Cypress · ${{ matrix.lane }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Browser: \`${{ matrix.browser }}\`"
            echo "- Node: \`${{ matrix.node }}\`"
            echo "- npm: \`${NPM_VERSION}\` (exactly verified)"
            echo '- Target: repository-owned loopback fixture'
            echo '- Evidence: minimum five executed tests + reconciled manifest + failure screenshots/video'
            echo '- Flake policy: retry-recovered passes fail the gate'
          } | tee "reports/extended-node-${{ matrix.node }}-${{ matrix.browser }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cypress-node-${{ matrix.node }}-${{ matrix.browser }}-extended-evidence
          path: |
            reports/
            cypress/screenshots/
            cypress/videos/
            cypress/downloads/
          if-no-files-found: error
          retention-days: 14

  extended-gate:
    name: extended-gate
    if: always()
    needs: [compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Evaluate compatibility jobs
        env:
          COMPATIBILITY: ${{ needs.compatibility.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$COMPATIBILITY" == "success" ]] || { echo "compatibility=$COMPATIBILITY"; exit 1; }
