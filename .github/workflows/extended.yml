name: extended

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "config/**"
      - "cypress/**"
      - "cypress.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/extended.yml"
  schedule:
    - cron: "59 7 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-extended-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      CYPRESS_BASE_URL: https://www.saucedemo.com
      TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run config:check
      - run: npm run cypress:verify
      - name: Run Cypress in ${{ matrix.browser }}
        run: npm run test:${{ matrix.browser }}
      - name: Publish browser observability summary
        if: always()
        run: |
          mkdir -p "reports/extended-${{ matrix.browser }}"
          {
            echo "### Cypress · ${{ matrix.browser }}"
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Browser: \`${{ matrix.browser }}\`"
            echo "- Node: \`22\`"
            echo "- Job status: \`${{ job.status }}\`"
            echo "- Evidence: run manifest + screenshots + video"
          } | tee "reports/extended-${{ matrix.browser }}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cross-browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-${{ matrix.browser }}-extended-evidence
          path: |
            reports/
            cypress/screenshots/
            cypress/videos/
            cypress/downloads/
          if-no-files-found: ignore
          retention-days: 14
