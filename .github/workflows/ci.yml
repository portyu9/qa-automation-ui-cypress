name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CYPRESS_BASE_URL: https://www.saucedemo.com
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run config:check
      - run: npm run cypress:verify
      - name: Run Chrome E2E gate
        run: npm run test:chrome
      - name: Upload Cypress failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence
          path: |
            cypress/screenshots/
            cypress/videos/
            cypress/downloads/
          if-no-files-found: ignore
          retention-days: 14
