name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-ui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CYPRESS_BASE_URL: http://127.0.0.1:3100
  TEST_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run config:check
      - run: npm run cypress:verify
      - name: Run Chrome E2E gate against repository-owned fixture
        run: npm run test:chrome
      - name: Publish CI observability summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p reports
          node - <<'NODE'
          const fs = require('node:fs');
          const payload = {
            schemaVersion: 1,
            framework: 'cypress',
            runId: process.env.TEST_RUN_ID,
            dimension: { node: '22', browser: 'chrome', target: 'local-fixture' },
            status: process.env.JOB_STATUS,
            sha: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF,
          };
          fs.writeFileSync('reports/ci-observability.json', `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          {
            echo '### Cypress · Chrome'
            echo
            echo "- Run ID: \`${TEST_RUN_ID}\`"
            echo "- Job status: \`${JOB_STATUS}\`"
            echo '- Target: repository-owned loopback fixture'
            echo '- Evidence: run manifest + screenshots/video + CI observability envelope'
          } | tee reports/ci-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Cypress evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-evidence
          path: |
            reports/
            cypress/screenshots/
            cypress/videos/
            cypress/downloads/
          if-no-files-found: ignore
          retention-days: 14
